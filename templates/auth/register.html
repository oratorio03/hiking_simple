{% extends 'base.html' %}
{% block title %}Registrati — PredictSport{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center min-vh-100 px-3 py-5">
  <div class="mb-4 text-center">
    <i class="bi bi-trophy-fill text-primary" style="font-size:3rem"></i>
    <h1 class="fw-bold mt-2 fs-3">PredictSport</h1>
    <p class="text-muted small">Crea il tuo account gratuito</p>
  </div>

  <div class="card shadow-sm w-100" style="max-width:400px">
    <div class="card-body p-4">
      <h5 class="card-title fw-bold mb-4">Registrati</h5>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Scegli un username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" placeholder="tua@email.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Min. 6 caratteri" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">Crea account</button>
      </form>
    </div>
  </div>

  <p class="mt-3 text-muted small">
    Hai già un account?
    <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Accedi</a>
  </p>
</div>
{% endblock %}
